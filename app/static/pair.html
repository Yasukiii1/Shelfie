<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shelfie</title>
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
<style>
  body { overflow: auto; }
  .pair-page { min-height: 100dvh; display: grid; place-items: center; padding: 32px 22px; position: relative; z-index: 1; }
  .pair-card { max-width: 420px; text-align: center; }
  .pair-card img { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 16px 34px -14px rgb(0 0 0 / .45); }
  .pair-card h1 { font: 500 40px/1.05 var(--serif); letter-spacing: -.03em; margin: 22px 0 10px; }
  .pair-card p { color: var(--ink-2); margin: 0 0 10px; }
  .pair-card .note { font: 400 11px var(--mono); color: var(--ink-3); margin-top: 22px; letter-spacing: .04em; }
</style></head>
<body><div class="pair-page"><div class="pair-card">
  <img src="/icons/apple-touch-icon.png" alt="">
  <h1>This archive is private.</h1>
  <p>Open Shelfie on your computer, click <b>Connect iPhone</b> in the sidebar, and scan the code with your Camera.</p>
  <p class="note">Your PDFs never leave your own computer.</p>
</div></div></body></html>
